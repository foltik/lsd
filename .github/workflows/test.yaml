name: Test
on:
  pull_request:

# These jobs mirror scripts/hooks/pre-commit. Keep the two in sync.

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  sqlx:
    name: SQLx
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      DATABASE_URL: sqlite://db.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install sqlx-cli --no-default-features --features sqlite
      - run: cargo sqlx database setup
      - run: cargo sqlx prepare --check

  rustfmt:
    name: Format
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4
      # Nightly, because rustfmt.toml uses unstable options.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Lint
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features -- -D warnings

  coauthors:
    name: Check for AI commits
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          if git log --format=%B "$BASE_SHA..$HEAD_SHA" | grep -iE '^co-authored-by:.*(anthropic|claude|openai|codex|gpt|cursor)'; then
            echo "::error::PR contains commits authored by an AI model. To ensure legible history, please manually chunk your changes into logical commits, and write all titles and descriptions by hand."
            exit 1
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  cross:
    name: Cross-compile
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: install gcc-aarch64-linux-gnu
        run: sudo apt update && sudo apt install -y gcc-aarch64-linux-gnu
      - run: cargo build --target aarch64-unknown-linux-gnu
