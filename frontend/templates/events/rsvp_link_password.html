{% extends "layout.html" %}

{% block title %}RSVP to {{ event.title }} - L&SD{% endblock title %}

{% block content %}
  <section id="events/rsvp/link_password" class="ext/layout thin">
    <header>
      <h1>Please verify your invitation.</h1>
    </header>
    <form
      id="form"
      class="ext/form"
      method="POST"
      action="/e/{{ event.slug }}/{{ link.slug }}"
    >
      <div class="field">
        <label for="password">Password</label>
        <div class="entry">
          <input id="password" name="password" type="text" autocorrect="off" autocapitalize="off" spellcheck="false" required />
          <button class="ext/button :green" type="submit">Enter</button>
        </div>
      </div>
    </form>
  </section>
{% endblock content %}
