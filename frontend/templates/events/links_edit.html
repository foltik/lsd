{% extends "layout.html" %}
{% block title %}{% if link.id == 0 %}New link{% else %}Edit link - {{ link.slug }}{% endif %} - L&SD{% endblock %}

{% block content %}
  <section id="events/links/edit" class="ext/layout standard">
    <header>
      <h1>{% if link.id == 0 %}New Link{% else %}Edit Link{% endif %}</h1>
    </header>
    <form class="ext/form" method="POST" action="/events/{{ event.id }}/links/{{ link.id }}">
      <div class="field">
        <label for="slug">Slug</label>
        <input
          type="text"
          id="slug"
          name="slug"
          value="{{ link.slug }}"
          pattern="[a-zA-Z0-9\-]+"
          title="Only letters, numbers, and dashes allowed"
          required
        />
      </div>
      <div class="field">
        <label for="description">Description (optional)</label>
        <input type="text" id="description" name="description" value="{{ link.description }}" />
      </div>
      <div class="field">
        <label for="password">Password (optional)</label>
        <input type="text" id="password" name="password" value="{{ link.password | unwrap_or_empty }}" />
      </div>
      <div class="field">
        <label for="capacity">Capacity</label>
        <input
          type="number"
          id="capacity"
          name="capacity"
          min="1"
          required
          value="{% if link.id != 0 %}{{ link.capacity }}{% endif %}"
        />
      </div>
      <div class="field">
        <label for="spots_per_person">Override max spots per person (optional)</label>
        <input
          type="number"
          id="spots_per_person"
          name="spots_per_person"
          min="1"
          step="1"
          placeholder="Event default"
          value="{{ link.spots_per_person | unwrap_or_empty }}"
        />
      </div>
      <div class="field">
        <label for="bypass_capacity">Bypass event capacity</label>
        <input
          id="bypass_capacity"
          name="bypass_capacity"
          type="checkbox"
          value="true"
          {% if link.bypass_capacity %}checked{% endif %}
        />
      </div>
      <div class="field">
        <label for="bypass_closed">Bypass registration closure</label>
        <input
          id="bypass_closed"
          name="bypass_closed"
          type="checkbox"
          value="true"
          {% if link.bypass_closed %}checked{% endif %}
        />
      </div>
      <div class="field">
        <label for="closed">Close registration through this link</label>
        <input
          id="closed"
          name="closed"
          type="checkbox"
          value="true"
          {% if link.closed %}checked{% endif %}
        />
      </div>
      <button class="ext/button :green" type="submit">Save</button>
    </form>
  </section>
{% endblock %}
